databases:
  - name: planeta-fitness-db
    plan: free
    databaseName: planeta_fitness
    user: planeta_app

services:
  - type: web
    name: planeta-fitness-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: server
    buildCommand: npm ci
    preDeployCommand: npm run db:deploy
    startCommand: npm start
    healthCheckPath: /salud
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: planeta-fitness-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://ariel-as.github.io
      # Token de la tarea diaria: se pone a mano en Render y el mismo valor va en el secreto TAREAS_TOKEN de GitHub.
      - key: TAREAS_TOKEN
        sync: false
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: HTTPS
        value: "false"
