name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Validación estática y auditoría
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/planeta_ci?schema=public
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Instalar dependencias bloqueadas
        run: npm ci
      - name: Generar Prisma Client
        run: npm run db:generate
      - name: Validar esquema Prisma
        run: npm run validate
      - name: Auditar dependencias
        run: npm run audit

  integration:
    name: Migraciones, seed y pruebas de integración
    runs-on: ubuntu-latest
    needs: static
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: planeta_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d planeta_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PORT: 5050
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/planeta_ci?schema=public
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      JWT_EXPIRES_IN: 2h
      CORS_ORIGINS: http://localhost:5500
      SEED_ADMIN_PASSWORD: Admin12345
      SEED_CLIENTE_PASSWORD: Cliente12345
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Instalar dependencias bloqueadas
        run: npm ci
      - name: Generar Prisma Client
        run: npm run db:generate
      - name: Validar esquema Prisma
        run: npm run validate
      - name: Aplicar migraciones
        run: npm run db:deploy
      - name: Cargar datos de prueba
        run: npm run db:seed
      - name: Ejecutar pruebas
        run: npm test
      - name: Comprobar arranque y healthcheck
        run: |
          node server.js > server.log 2>&1 &
          PID=$!
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:5050/salud
          kill $PID
